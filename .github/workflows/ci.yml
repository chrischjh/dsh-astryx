name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: npm test
      - name: Package contents
        run: npm pack --dry-run
      - name: Manifest declares a bundle patch
        shell: bash
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) { console.error('missing dsh.bundle.patch'); process.exit(1) }"
