name: chrischjh/dsh-astryx
category: dev
description:
  en: 'Watches @astryxdesign releases and judges whether the newest Astryx still fits the plugin support contract, then self-checks the local wiring: the plugin row, the CLI surface via astryx manifest --json, a live Astryx MCP handshake, and whether the Astryx skill sits in a directory DSH actually loads. Read-only, cached, cross-platform.'
  zh: '盯 @astryxdesign 的新版本并判断最新 Astryx 是否仍在插件的支持约定内，同时自检本地接线：插件行是否存活、CLI 面（astryx manifest --json）是否完整、Astryx MCP 能否真实握手、以及 Astryx 技能是否落在 DSH 真正会加载的目录里。只读、带缓存、跨平台。'
icon: https://raw.githubusercontent.com/chrischjh/dsh-astryx/main/assets/icon-180.png
